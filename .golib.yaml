schema_version: 1
tool_version: v2.4.0
tool_checksums_sha256: 875e5592e9fbea713c492d9e6979202e1d6bf687f52f55654e3e72c192963273
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: ".verification"
mutation:
  root: ".verification/mutation"
  imports:
  - module: "."
    archive: ".verification/mutation/bootstrap/root.zip"
    ledger: ".verification/mutation/migration-ledger.json"
api:
  baselines:
  - module: "."
    mode: apidiff
    path: api/v2.txt
operations:
- module: "."
  gate: local-test
  steps:
  - type: go-test
    packages: ["."]
    run: '^Test(ConcurrentReleaseReturnsWeightExactlyOnce|AcquireDoesNotAdmitCancellationWhileWaitingForAccountingLock|CloseRejectsWaitersAndWaitDrainsExistingPermits)$'
    race: true
    count: 1
    timeout: 2m
- module: "."
  gate: docs
  steps:
  - type: make
    makefile: verification/package.mk
    target: docs
    timeout: 20m
- module: "."
  gate: test
  steps:
  - type: make
    makefile: verification/package.mk
    target: stress
    timeout: 20m
  - type: make
    makefile: verification/package.mk
    target: leak
    timeout: 20m
- module: "."
  gate: fuzz
  steps:
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzConfigAndTryAcquire$'
    budget: 100x
    timeout: 2m
- module: "."
  gate: benchmark
  steps:
  - type: go-test
    packages: ["./..."]
    benchmark: "."
    budget: 100ms
    timeout: 20m
